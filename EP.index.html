                options: ["The Kakapo, a flightless parrot native to New Zealand, has a population of just over 200.", "To protect the critically endangered Kakapo, conservationists have relocated individuals to predator-free island sanctuaries.", "Native to New Zealand, the Kakapo is a large parrot that cannot fly.", "There are over 200 Kakapos living in New Zealand, making them heavily endangered."], 
                correct: "To protect the critically endangered Kakapo, conservationists have relocated individuals to predator-free island sanctuaries.", 
                stratType: "Rhetorical Strategy", 
                stratRec: "Identify the specific goal in the prompt ('emphasize the conservation strategy') and eliminate options that only state background facts.", 
                trad: "This option is the only one that focuses primarily on the action taken to save the birds (relocation to predator-free sanctuaries), matching the prompt's exact goal.", 
                desmos: "N/A" 
            }],
            transitions: [{ 
                q: "The museum's budget was drastically reduced for the upcoming fiscal year. _________, the board of directors decided to cancel the highly anticipated summer exhibition.", 
                options: ["However", "Consequently", "For example", "Nevertheless"], 
                correct: "Consequently", 
                stratType: "Grammar & Transitions", 
                stratRec: "Determine the relationship between the two sentences. A reduced budget causes the cancellation of an event.", 
                trad: "'Consequently' correctly signals a cause-and-effect relationship, where the second sentence is a direct result of the first.", 
                desmos: "N/A" 
            }],
            boundaries: [{ 
                q: "The team members, who were exhausted from the grueling cross-country flight, ________ to rest at the hotel before beginning their research.", 
                options: ["decided", "deciding", "to decide", "having decided"], 
                correct: "decided", 
                stratType: "Standard English Conventions", 
                stratRec: "Identify the main subject ('The team members') and ensure the sentence has a functioning main verb.", 
                trad: "The subject 'The team members' requires a finite main verb. 'Decided' provides the necessary verb to complete the independent clause.", 
                desmos: "N/A" 
            }],
            form_structure: [{ 
                q: "By the time the lead architect arrives at the construction site tomorrow morning, the engineering team ________ the foundation inspection.", 
                options: ["completed", "will complete", "will have completed", "completes"], 
                correct: "will have completed", 
                stratType: "Verb Tense & Agreement", 
                stratRec: "Look for time markers. 'By the time... tomorrow morning' requires a specific future tense.", 
                trad: "The future perfect tense 'will have completed' correctly indicates that the inspection will be finished prior to the architect's arrival tomorrow.", 
                desmos: "N/A" 
            }]
        };

        class App {
            constructor() {
                this.sessionStats = {
                    total: 0,
                    correct: 0,
                    wrong: 0,
                    timeSeconds: 0
                };
                this.isStopwatch = false;
                
                this.currentTab = 'practice';
                this.topicTab = 'learn';
                this.currentSubject = null; 
                this.currentDomain = null;
                this.currentSkill = null;
                this.quizMode = 'drill';
                this.questions = [];
                this.currentIndex = 0;
                this.score = 0;
                this.userAnswers = {};
                this.eliminatedOptions = {};
                this.calculator = null;
                this.calcVisible = false;
                this.timerInterval = null;
                this.timeLeft = 0;
                this.initCalculator();
                this.render();
            }

            initCalculator() {
                setTimeout(() => {
                    const elt = document.getElementById('calculator-element');
                    if (elt && !this.calculator) {
                        this.calculator = Desmos.GraphingCalculator(elt, { expressions: true, settingsMenu: true });
                    }
                }, 200);
            }

            toggleCalculator() {
                this.calcVisible = !this.calcVisible;
                const drawer = document.getElementById('calc-drawer');
                if (this.calcVisible) {
                    drawer.classList.remove('hidden');
                    if (this.calculator) this.calculator.resize();
                } else {
                    drawer.classList.add('hidden');
                }
            }

            selectSubject(subject) {
                this.currentSubject = subject;
                document.getElementById('exit-btn').classList.remove('hidden');
                this.render();
            }

            returnHome() {
                if (this.currentSkill || this.quizMode === 'adaptive' || this.quizMode === 'drill_results') {
                    this.currentDomain = null;
                    this.currentSkill = null;
                    this.quizMode = 'drill';
                    this.questions = [];
                    this.stopTimer();
                    document.getElementById('timer-box').classList.add('hidden');
                } else {
                    this.currentSubject = null;
                    document.getElementById('exit-btn').classList.add('hidden');
                }
                this.render();
            }

            getActiveCurriculum() {
                return this.currentSubject === 'english' ? ENGLISH_CURRICULUM : MATH_CURRICULUM;
            }

            getActiveBank() {
                return this.currentSubject === 'english' ? ENGLISH_QUESTION_BANK : MATH_QUESTION_BANK;
            }

            startDrill(domainName, skillId) {
                this.quizMode = 'drill';
                this.currentDomain = domainName;
                this.currentSkill = skillId;
                this.topicTab = 'learn'; 
                this.loadQuestion();
                this.render();
            }

            switchTopicTab(tab) {
                this.topicTab = tab;
                if (tab === 'practice') {
                    // Reset session stats when starting a practice session
                    this.sessionStats = { total: 0, correct: 0, wrong: 0, timeSeconds: 0 };
                    document.getElementById('timer-box').classList.remove('hidden');
                    this.startTimer(null); // NULL triggers Stopwatch mode
                } else {
                    document.getElementById('timer-box').classList.add('hidden');
                    this.stopTimer();
                }
                this.render();
            }

            finishDrill() {
                this.stopTimer();
                this.quizMode = 'drill_results';
                document.getElementById('timer-box').classList.add('hidden');
                this.render();
            }

            startAdaptiveTest() {
                this.quizMode = 'adaptive';
                this.currentIndex = 0;
                this.score = 0;
                this.userAnswers = {};
                this.eliminatedOptions = {};
                
                this.questions = [];
                const allSkills = [];
                const activeCurriculum = this.getActiveCurriculum();
                const activeBank = this.getActiveBank();

                activeCurriculum.forEach(d => d.skills.forEach(s => allSkills.push(s.id)));
                const totalQs = this.currentSubject === 'english' ? 27 : 22;

                for (let i = 0; i < totalQs; i++) {
                    const randomSkillId = allSkills[Math.floor(Math.random() * allSkills.length)];
                    const bankList = activeBank[randomSkillId] || activeBank[Object.keys(activeBank)[0]];
                    const qItem = bankList[Math.floor(Math.random() * bankList.length)];
                    this.questions.push({ ...qItem, skillName: randomSkillId });
                }

                // Get Accommodations Multiplier
                let multiplier = 1;
                const dropdown = document.getElementById('time-multiplier');
                if (dropdown) {
                    multiplier = parseFloat(dropdown.value);
                }

                document.getElementById('timer-box').classList.remove('hidden');
                const timerMinutes = this.currentSubject === 'english' ? 32 : 35;
                
                // Start timer with applied multiplier
                this.startTimer(timerMinutes * 60 * multiplier); 
                this.render();
            }

            startTimer(seconds) {
                this.stopTimer();
                if (seconds === null) {
                    this.isStopwatch = true;
                    this.timeLeft = 0;
                } else {
                    this.isStopwatch = false;
                    this.timeLeft = seconds;
                }
                
                const display = document.getElementById('timer-display');
                this.timerInterval = setInterval(() => {
                    
                    if (this.isStopwatch) {
                        this.timeLeft++;
                        this.sessionStats.timeSeconds++;
                    } else {
                        this.timeLeft--;
                        if (this.timeLeft <= 0) {
                            this.stopTimer();
                            alert("Time's up!");
                            if(this.quizMode === 'adaptive') this.finishModule();
                            return;
                        }
                    }
                    
                    const m = Math.floor(this.timeLeft / 60);
                    const s = this.timeLeft % 60;
                    display.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                }, 1000);
            }

            stopTimer() {
                if (this.timerInterval) clearInterval(this.timerInterval);
            }

            loadQuestion() {
                const activeBank = this.getActiveBank();
                const bankList = activeBank[this.currentSkill] || activeBank[Object.keys(activeBank)[0]];
                const qItem = bankList[Math.floor(Math.random() * bankList.length)];
                this.questions = [{ ...qItem }];
                this.currentIndex = 0;
                this.userAnswers = {};
                this.eliminatedOptions = {};
            }

            render() {
                const panel = document.getElementById('main-panel');
                if (!panel) return;

                if (this.currentDomain && this.currentSkill && this.quizMode === 'drill') {
                    panel.innerHTML = this.renderTopicDashboard();
                } else if (this.quizMode === 'drill_results') {
                    panel.innerHTML = this.renderDrillResults();
                } else if (this.quizMode === 'adaptive' && this.questions.length > 0) {
                    panel.innerHTML = this.renderAdaptiveView();
                } else {
                    if (!this.currentSubject) {
                        panel.innerHTML = this.renderSubjectSelection();
                    } else if (this.currentSubject === 'math') {
                        panel.innerHTML = this.renderSubjectDashboard('Math', '🧮 Math Section', 'bg-blue-600', 'to-blue-800', MATH_CURRICULUM, 22);
                    } else if (this.currentSubject === 'english') {
                        panel.innerHTML = this.renderSubjectDashboard('Reading & Writing', '📖 Reading & Writing Section', 'bg-indigo-600', 'to-indigo-800', ENGLISH_CURRICULUM, 27);
                    }
                }

                // Calculator Button Visibility Logic
                const calcBtn = document.getElementById('calc-toggle-btn');
                if (calcBtn) {
                    if (this.currentSubject === 'math' && this.currentDomain) {
                        calcBtn.classList.remove('hidden');
                        calcBtn.classList.add('flex');
                    } else {
                        calcBtn.classList.add('hidden');
                        calcBtn.classList.remove('flex');
                        if (this.calcVisible) this.toggleCalculator(); // close it if open
                    }
                }

                // KaTeX Auto-Render Logic with strict dollar sign matching to prevent bugs
                setTimeout(() => { 
                    if (window.renderMathInElement) {
                        renderMathInElement(panel, {
                            delimiters: [
                                {left: "$$", right: "$$", display: true},
                                {left: "$", right: "$", display: false}
                            ],
                            throwOnError: false
                        });
                    } 
                }, 50);
            }

            renderSubjectSelection() {
                // Completely pure grid layout - no stats box on the home screen anymore
                return `
                    <div class="max-w-4xl mx-auto flex flex-col items-center justify-center min-h-[60vh] space-y-6 animate-fade-in">
                        <div class="text-center space-y-2 mb-4 mt-8">
                            <h2 class="text-4xl font-extrabold text-slate-900">Select Your Section</h2>
                            <p class="text-slate-500">Choose a subject to begin practicing official SAT questions.</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full">
                            <div onclick="app.selectSubject('math')" class="cursor-pointer group bg-white border-2 border-slate-200 hover:border-blue-500 rounded-3xl p-8 shadow-sm hover:shadow-xl transition-all flex flex-col items-center text-center space-y-4">
                                <div class="w-20 h-20 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center text-4xl mb-2">🧮</div>
                                <h3 class="text-2xl font-bold text-slate-900 group-hover:text-blue-600 transition">Math</h3>
                                <p class="text-slate-500 text-sm">Algebra, Advanced Math, Problem-Solving & Data Analysis, and Geometry.</p>
                                <span class="bg-blue-50 text-blue-700 px-4 py-2 rounded-xl font-bold text-sm w-full mt-4 group-hover:bg-blue-600 group-hover:text-white transition">Enter Section →</span>
                            </div>
                            <div onclick="app.selectSubject('english')" class="cursor-pointer group bg-white border-2 border-slate-200 hover:border-indigo-500 rounded-3xl p-8 shadow-sm hover:shadow-xl transition-all flex flex-col items-center text-center space-y-4">
                                <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center text-4xl mb-2">📖</div>
                                <h3 class="text-2xl font-bold text-slate-900 group-hover:text-indigo-600 transition">Reading & Writing</h3>
                                <p class="text-slate-500 text-sm">Information & Ideas, Craft & Structure, Expression of Ideas, and Standard English Conventions.</p>
                                <span class="bg-indigo-50 text-indigo-700 px-4 py-2 rounded-xl font-bold text-sm w-full mt-4 group-hover:bg-indigo-600 group-hover:text-white transition">Enter Section →</span>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderSubjectDashboard(title, iconTitle, colorStart, colorEnd, curriculumData, qCount) {
                const btnColorHover = title === 'Math' ? 'hover:bg-blue-50 text-blue-700' : 'hover:bg-indigo-50 text-indigo-700';
                const tagColor = title === 'Math' ? 'text-blue-700 group-hover:text-blue-700' : 'text-indigo-700 group-hover:text-indigo-700';
                const tagBg = title === 'Math' ? 'bg-blue-50 group-hover:bg-blue-600 group-hover:text-white' : 'bg-indigo-50 group-hover:bg-indigo-600 group-hover:text-white';
                const borderHover = title === 'Math' ? 'hover:border-blue-300 hover:bg-blue-50/50' : 'hover:border-indigo-300 hover:bg-indigo-50/50';

                return `
                    <div class="max-w-5xl mx-auto space-y-8 animate-fade-in">
                        <div class="bg-gradient-to-r ${colorStart} ${colorEnd} rounded-3xl p-8 text-white shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center space-y-4 md:space-y-0">
                            <div>
                                <h2 class="text-3xl font-extrabold mb-2">${iconTitle}</h2>
                                <p class="${title === 'Math' ? 'text-blue-100' : 'text-indigo-100'} max-w-xl">Curated question bank matching official Bluebook difficulty and structure.</p>
                                <div class="flex items-center space-x-2 bg-black/10 px-3 py-1.5 rounded-lg mt-4 w-fit">
                                    <span class="text-sm font-semibold text-white">Accommodations:</span>
                                    <select id="time-multiplier" class="bg-transparent text-white font-bold outline-none text-sm cursor-pointer">
                                        <option value="1" class="text-slate-900">Standard Time</option>
                                        <option value="1.5" class="text-slate-900">1.5x Time</option>
                                        <option value="2" class="text-slate-900">2.0x Time</option>
                                    </select>
                                </div>
                            </div>
                            <button onclick="app.startAdaptiveTest()" class="bg-white ${btnColorHover} font-bold px-6 py-3 rounded-2xl shadow-md transition flex items-center space-x-2">
                                <span>🚀 Simulate Adaptive Test (${qCount} Qs)</span>
                            </button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            ${curriculumData.map(dom => `
                                <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm hover:shadow-md transition">
                                    <h3 class="text-lg font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100 flex items-center justify-between">
                                        <span>${dom.domain}</span>
                                        <span class="text-xs font-semibold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full">${dom.skills.length} Skills</span>
                                    </h3>
                                    <div class="space-y-3">
                                        ${dom.skills.map(s => `
                                            <div onclick="app.startDrill('${dom.domain}', '${s.id}')" class="group p-3 rounded-xl border border-slate-100 ${borderHover} cursor-pointer transition flex justify-between items-center">
                                                <div>
                                                    <h4 class="font-semibold text-slate-800 ${tagColor} text-sm">${s.name}</h4>
                                                    <p class="text-xs text-slate-500">${s.desc}</p>
                                                </div>
                                                <span class="text-xs font-bold ${tagBg} px-3 py-1.5 rounded-lg transition">Study →</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            renderTopicDashboard() {
                const activeBank = this.getActiveBank();
                const bankList = activeBank[this.currentSkill] || activeBank[Object.keys(activeBank)[0]];
                const qItem = bankList[0]; 
                
                const themeColor = this.currentSubject === 'english' ? 'indigo' : 'blue';

                let tabsHtml = '';
                if (this.currentSubject === 'math') {
                    tabsHtml = `
                        <div class="flex space-x-6 border-b border-slate-200 mb-8">
                            <button onclick="app.switchTopicTab('learn')" class="pb-3 px-2 text-lg font-medium transition-colors ${this.topicTab === 'learn' ? 'border-b-4 border-blue-600 text-blue-600' : 'text-slate-500 hover:text-slate-800'}">📚 Learn</button>
                            <button onclick="app.switchTopicTab('formulas')" class="pb-3 px-2 text-lg font-medium transition-colors ${this.topicTab === 'formulas' ? 'border-b-4 border-blue-600 text-blue-600' : 'text-slate-500 hover:text-slate-800'}">∑ Formulas</button>
                            <button onclick="app.switchTopicTab('practice')" class="pb-3 px-2 text-lg font-medium transition-colors ${this.topicTab === 'practice' ? 'border-b-4 border-blue-600 text-blue-600' : 'text-slate-500 hover:text-slate-800'}">⚡ Practice</button>
                        </div>
                    `;
                } else {
                    tabsHtml = `
                        <div class="flex space-x-6 border-b border-slate-200 mb-8">
                            <button onclick="app.switchTopicTab('learn')" class="pb-3 px-2 text-lg font-medium transition-colors ${this.topicTab === 'learn' ? 'border-b-4 border-indigo-600 text-indigo-600' : 'text-slate-500 hover:text-slate-800'}">📚 Learn</button>
                            <button onclick="app.switchTopicTab('practice')" class="pb-3 px-2 text-lg font-medium transition-colors ${this.topicTab === 'practice' ? 'border-b-4 border-indigo-600 text-indigo-600' : 'text-slate-500 hover:text-slate-800'}">⚡ Practice</button>
                        </div>
                    `;
                }

                let contentHtml = '';
                if (this.topicTab === 'learn') {
                    contentHtml = `
                        <div class="space-y-6">
                            <div class="bg-slate-50 border border-slate-200 p-6 rounded-2xl">
                                <h3 class="font-bold text-slate-800 mb-2 text-lg">The Concept</h3>
                                <p class="text-slate-700 leading-relaxed">${qItem.trad || 'Read carefully and apply logical reasoning.'}</p>
                            </div>
                            ${this.currentSubject === 'math' ? `
                            <div class="bg-emerald-50 border border-emerald-200 p-6 rounded-2xl">
                                <h3 class="font-bold text-emerald-800 mb-2 flex items-center gap-2 text-lg"><span>⚡</span> The Desmos Shortcut</h3>
                                <p class="text-emerald-900 leading-relaxed">${qItem.desmos || 'Use Desmos to bypass complex algebra.'}</p>
                            </div>
                            ` : `
                            <div class="bg-indigo-50 border border-indigo-200 p-6 rounded-2xl">
                                <h3 class="font-bold text-indigo-800 mb-2 flex items-center gap-2 text-lg"><span>🎯</span> Core Strategy</h3>
                                <p class="text-indigo-900 leading-relaxed">${qItem.stratRec || 'Focus on the main idea and supporting evidence.'}</p>
                            </div>
                            `}
                        </div>
                    `;
                } else if (this.topicTab === 'formulas') {
                    contentHtml = `
                        <div class="bg-amber-50 border border-amber-200 p-8 rounded-2xl text-center shadow-sm">
                            <h3 class="font-bold text-amber-900 mb-6 text-2xl">Must-Know Formulas</h3>
                            <div class="text-xl leading-loose font-medium text-amber-800 bg-amber-100/50 p-6 rounded-xl inline-block text-left">
                                ${qItem.formula}
                            </div>
                        </div>
                    `;
                } else if (this.topicTab === 'practice') {
                    contentHtml = this.renderQuizContent();
                }

                return `
                    <div class="max-w-4xl mx-auto w-full animate-fade-in">
                        <div class="mb-4">
                            <button onclick="app.returnHome()" class="text-sm font-semibold text-${themeColor}-600 hover:text-${themeColor}-800 transition">← Back to Domains</button>
                        </div>
                        <h2 class="text-3xl font-extrabold text-slate-900 mb-6">${this.getSkillName(this.currentSkill)}</h2>
                        ${tabsHtml}
                        ${contentHtml}
                    </div>
                `;
            }

            renderDrillResults() {
                const s = this.sessionStats;
                const pct = s.total > 0 ? Math.round((s.correct / s.total) * 100) : 0;
                const m = Math.floor(s.timeSeconds / 60);
                const sec = s.timeSeconds % 60;
                const timeStr = `${m}m ${sec}s`;
                const themeColor = this.currentSubject === 'english' ? 'text-indigo-600' : 'text-blue-600';
                const bgHover = this.currentSubject === 'english' ? 'bg-indigo-600 hover:bg-indigo-700' : 'bg-blue-600 hover:bg-blue-700';

                return `
                    <div class="max-w-3xl mx-auto bg-white border border-slate-200 rounded-3xl p-8 shadow-sm space-y-6 text-center animate-fade-in mt-10">
                        <h2 class="text-3xl font-extrabold text-slate-900">Practice Session Complete! 🎯</h2>
                        <p class="text-slate-500">Here's how you did on ${this.getSkillName(this.currentSkill)}</p>
                        
                        <div class="w-full border border-slate-100 bg-slate-50 rounded-2xl p-6 flex flex-col md:flex-row justify-around items-center my-6">
                            <div class="text-center p-4">
                                <p class="text-slate-500 text-sm font-semibold uppercase tracking-wider">Questions</p>
                                <p class="text-3xl font-extrabold text-slate-800">${s.total}</p>
                            </div>
                            <div class="hidden md:block w-px h-12 bg-slate-200"></div>
                            <div class="text-center p-4">
                                <p class="text-slate-500 text-sm font-semibold uppercase tracking-wider">Accuracy</p>
                                <p class="text-3xl font-extrabold ${themeColor}">${pct}%</p>
                                <p class="text-xs text-slate-400 mt-1">${s.correct} Right / ${s.wrong} Wrong</p>
                            </div>
                            <div class="hidden md:block w-px h-12 bg-slate-200"></div>
                            <div class="text-center p-4">
                                <p class="text-slate-500 text-sm font-semibold uppercase tracking-wider">Time</p>
                                <p class="text-3xl font-extrabold text-emerald-600">${timeStr}</p>
                            </div>
                        </div>

                        <div class="flex justify-center space-x-4">
                            <button onclick="app.startDrill('${this.currentDomain}', '${this.currentSkill}')" class="px-6 py-3 rounded-xl border border-slate-200 font-semibold text-slate-600 hover:bg-slate-100 transition">Study Again</button>
                            <button onclick="app.returnHome()" class="${bgHover} text-white font-bold px-8 py-3 rounded-xl shadow-md transition">Back to Dashboard</button>
                        </div>
                    </div>
                `;
            }

            renderQuizContent() {
                const q = this.questions[this.currentIndex];
                const answered = this.userAnswers[this.currentIndex] !== undefined;
                const selected = this.userAnswers[this.currentIndex];
                const themeColor = this.currentSubject === 'english' ? 'indigo' : 'blue';

                return `
                    <div class="space-y-6">
                        <div class="bg-white border border-slate-200 rounded-2xl p-8 shadow-sm space-y-6 relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-1 h-full bg-${themeColor}-500"></div>
                            <p class="text-lg font-medium text-slate-900 leading-relaxed">${q.q}</p>
                            <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 text-sm text-amber-900 flex items-start space-x-3 mt-6">
                                <span class="text-lg">💡</span>
                                <div>
                                    <strong class="block font-semibold mb-0.5">Strategy Recommendation (${q.stratType}):</strong>
                                    <span class="text-amber-800">${q.stratRec}</span>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-3">
                            ${q.options.map((opt, idx) => {
                                const label = String.fromCharCode(65 + idx);
                                const isEliminated = this.eliminatedOptions[this.currentIndex]?.[idx];
                                let cardStyle = "bg-white border-slate-200 text-slate-800";
                                if (answered) {
                                    if (opt === q.correct) cardStyle = "bg-emerald-50 border-emerald-500 text-emerald-900 font-semibold";
                                    else if (selected === opt) cardStyle = "bg-rose-50 border-rose-500 text-rose-900";
                                }
                                return `
                                    <div class="flex items-center space-x-3">
                                        <button onclick="app.toggleEliminate(${idx})" class="w-9 h-9 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 font-bold text-xs text-slate-500 transition flex items-center justify-center shrink-0">
                                            ${label}
                                        </button>
                                        <div onclick="${answered ? '' : `app.selectAnswer(${idx})`}" class="flex-1 border rounded-2xl p-4 cursor-pointer option-card flex justify-between items-center ${cardStyle} ${isEliminated ? 'opacity-40 bg-slate-50' : ''}">
                                            <div class="flex items-center space-x-3">
                                                <span class="w-6 h-6 rounded-full border border-slate-300 flex items-center justify-center text-xs font-bold text-slate-600">${label}</span>
                                                <span class="${isEliminated ? 'strikethrough' : ''}">${opt}</span>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        ${answered ? `
                            <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-4 animate-fade-in">
                                <div class="flex items-center space-x-2 text-lg font-bold ${selected === q.correct ? 'text-emerald-600' : 'text-rose-600'}">
                                    <span>${selected === q.correct ? '✓ Correct! Great job.' : '✕ Incorrect. Correct answer is ' + q.correct + '.'}</span>
                                </div>
                                <div class="border-t border-slate-100 pt-4 space-y-3 text-sm text-slate-700">
                                    <div><strong class="text-slate-900">Explanation:</strong> ${q.trad}</div>
                                    <div class="flex items-center space-x-3 mt-4">
                                        <button onclick="app.finishDrill()" class="px-6 py-2.5 rounded-xl border border-slate-300 font-bold text-sm text-slate-600 hover:bg-slate-50 transition">End Practice</button>
                                        <button onclick="app.loadQuestion(); app.render();" class="flex-1 bg-${themeColor}-600 hover:bg-${themeColor}-700 text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow-sm transition">Next Question →</button>
                                    </div>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            renderAdaptiveView() {
                const q = this.questions[this.currentIndex];
                const selected = this.userAnswers[this.currentIndex];
                const btnColorHover = this.currentSubject === 'english' ? 'bg-indigo-600 hover:bg-indigo-700' : 'bg-blue-600 hover:bg-blue-700';

                return `
                    <div class="max-w-4xl mx-auto space-y-6 animate-fade-in">
                        <div class="flex justify-between items-center bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                            <span class="bg-slate-100 text-slate-700 font-bold text-xs px-3 py-1.5 rounded-xl uppercase">Adaptive Test Mode</span>
                            <span class="text-sm font-semibold text-slate-600">Question ${this.currentIndex + 1} of ${this.questions.length}</span>
                        </div>
                        <div class="bg-white border border-slate-200 rounded-2xl p-8 shadow-sm space-y-6">
                            <p class="text-lg font-medium text-slate-900 leading-relaxed">${q.q}</p>
                            <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 text-sm text-amber-900 flex items-start space-x-3 mt-6">
                                <span class="text-lg">💡</span>
                                <span>${q.stratRec}</span>
                            </div>
                        </div>
                        <div class="space-y-3">
                            ${q.options.map((opt, idx) => {
                                const label = String.fromCharCode(65 + idx);
                                let cardStyle = "bg-white border-slate-200 text-slate-800";
                                if (selected === opt) cardStyle = "bg-slate-100 border-slate-400 font-semibold";
                                return `
                                    <div onclick="app.selectAdaptiveAnswer(${idx})" class="flex-1 border rounded-2xl p-4 cursor-pointer option-card flex justify-between items-center ${cardStyle}">
                                        <div class="flex items-center space-x-3">
                                            <span class="w-6 h-6 rounded-full border border-slate-300 flex items-center justify-center text-xs font-bold text-slate-600">${label}</span>
                                            <span>${opt}</span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                        <div class="flex justify-between pt-4">
                            <button onclick="app.prevQuestion()" class="px-5 py-2.5 rounded-xl border border-slate-200 font-semibold text-sm text-slate-600 hover:bg-slate-100 transition" ${this.currentIndex === 0 ? 'disabled' : ''}>← Previous</button>
                            <button onclick="app.nextAdaptiveQuestion()" class="${btnColorHover} text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow-sm transition">${this.currentIndex === this.questions.length - 1 ? 'Finish Module' : 'Next →'}</button>
                        </div>
                    </div>
                `;
            }

            selectAnswer(idx) {
                const opt = this.questions[this.currentIndex].options[idx];
                this.userAnswers[this.currentIndex] = opt;
                
                // Track session stats for drill mode
                this.sessionStats.total++;
                if (opt === this.questions[this.currentIndex].correct) {
                    this.score++;
                    this.sessionStats.correct++;
                } else {
                    this.sessionStats.wrong++;
                }
                
                this.render();
            }

            selectAdaptiveAnswer(idx) {
                const opt = this.questions[this.currentIndex].options[idx];
                this.userAnswers[this.currentIndex] = opt;
                this.render();
            }

            toggleEliminate(idx) {
                if (!this.eliminatedOptions[this.currentIndex]) this.eliminatedOptions[this.currentIndex] = {};
                this.eliminatedOptions[this.currentIndex][idx] = !this.eliminatedOptions[this.currentIndex][idx];
                this.render();
            }

            nextAdaptiveQuestion() {
                if (this.currentIndex < this.questions.length - 1) {
                    this.currentIndex++;
                    this.render();
                } else {
                    this.finishModule();
                }
            }

            prevQuestion() {
                if (this.currentIndex > 0) {
                    this.currentIndex--;
                    this.render();
                }
            }

            finishModule() {
                this.stopTimer();
                let correctCount = 0;
                
                // Grade for adaptive test
                this.questions.forEach((q, idx) => {
                    if (this.userAnswers[idx] !== undefined) {
                        if (this.userAnswers[idx] === q.correct) {
                            correctCount++;
                        }
                    }
                });
                
                const pct = Math.round((correctCount / this.questions.length) * 100);
                const btnColorHover = this.currentSubject === 'english' ? 'bg-indigo-600 hover:bg-indigo-700' : 'bg-blue-600 hover:bg-blue-700';

                const panel = document.getElementById('main-panel');
                panel.innerHTML = `
                    <div class="max-w-3xl mx-auto bg-white border border-slate-200 rounded-3xl p-8 shadow-sm space-y-6 text-center animate-fade-in">
                        <h2 class="text-3xl font-extrabold text-slate-900">Module Complete! 🎉</h2>
                        <div class="grid grid-cols-2 gap-4 max-w-md mx-auto py-4">
                            <div class="bg-slate-50 border border-slate-100 p-4 rounded-2xl">
                                <p class="text-sm text-slate-500 font-medium">Score</p>
                                <p class="text-3xl font-extrabold ${this.currentSubject === 'english' ? 'text-indigo-600' : 'text-blue-600'}">${correctCount} / ${this.questions.length}</p>
                            </div>
                            <div class="bg-slate-50 border border-slate-100 p-4 rounded-2xl">
                                <p class="text-sm text-slate-500 font-medium">Accuracy</p>
                                <p class="text-3xl font-extrabold text-emerald-600">${pct}%</p>
                            </div>
                        </div>
                        <button onclick="app.returnHome()" class="${btnColorHover} text-white font-bold px-8 py-3 rounded-2xl shadow-md transition">Return to Dashboard</button>
                    </div>
                `;
            }

            getSkillName(skillId) {
                for (let dom of MATH_CURRICULUM) {
                    const found = dom.skills.find(s => s.id === skillId);
                    if (found) return found.name;
                }
                for (let dom of ENGLISH_CURRICULUM) {
                    const found = dom.skills.find(s => s.id === skillId);
                    if (found) return found.name;
                }
                return "Practice";
            }
        }

        const style = document.createElement('style');
        style.innerHTML = "@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } } .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }";
        document.head.appendChild(style);

        const app = new App();
    </script>
</body>
</html>
